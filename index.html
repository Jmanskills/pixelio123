    }

    // ── Main Multiplayer Component ─────────────────────────────────────────────
    function MultiplayerGame({ playerData, settings, onEnd, aimbotMode, testMode }) {
      const canvasRef    = useRef(null);
      const stateRef     = useRef(null);   // full local game state
      const keysRef      = useRef({});
      const mouseRef     = useRef({ x:0, y:0, down:false, angle:0 });
      const channelRef   = useRef(null);
      const renderRef    = useRef(null);
      const tickRef      = useRef(null);
      const myIdRef      = useRef(playerData.username + '_' + Date.now());
      const isHostRef    = useRef(false);
      const emoteMapRef  = useRef({});

      const [phase, setPhase]           = useState('joining'); // joining|waiting|countdown|active|dead|ended
      const [countdown, setCountdown]   = useState(15);
      const [roomId, setRoomId]         = useState('');
      const [waitPlayers, setWaitPlayers] = useState([]);
      const [hud, setHud]               = useState({ health:100, shield:0, ammo:35, materials:50, weapon:'pistol', weapons:['pistol'], alive:1, kills:0, timeLeft:300 });
      const [notif, setNotif]           = useState(null);
      const [triviaPopup, setTriviaPopup] = useState(null);
      const [deathInfo, setDeathInfo]   = useState(null);
      const [pingMs, setPingMs]         = useState(0);
      const triviaRef = useRef(null);

      const showNotif = useCallback((text, icon='✨', color='#8b5cf6') => {
        setNotif({ text, icon, color });
        setTimeout(() => setNotif(null), 2500);
      }, []);

      // ── Join / create room ───────────────────────────────────────────────────
      useEffect(() => {
        const myId   = myIdRef.current;
        const rCode  = settings.roomCode ? 'priv_'+settings.roomCode.toUpperCase() : null;

        async function join() {
          // Find or create a room
          let roomData = null;

          if (rCode) {
            // Private room
            const { data } = await supa.from('rooms').select('*').eq('id', rCode).single();
            if (!data) {
              // Create it
              await supa.from('rooms').insert({ id: rCode, host: myId, phase:'waiting', loot: genLoot(), stations: genStations(), storm_radius: MAP_SZ*0.7, time_left: 300, countdown: 15 });
              roomData = { id: rCode, host: myId };
              isHostRef.current = true;
            } else {
              roomData = data;
            }
          } else {
            // Find open public room
            const { data: openRooms } = await supa.from('rooms').select('*').eq('phase','waiting').lt('player_count', 20).order('created_at').limit(1);
            if (openRooms && openRooms.length > 0) {
              roomData = openRooms[0];
            } else {
              const newId = 'pub_' + Math.random().toString(36).slice(2,10);
              await supa.from('rooms').insert({ id: newId, host: myId, phase:'waiting', loot: genLoot(), stations: genStations(), storm_radius: MAP_SZ*0.7, time_left: 300, countdown: 15 });
              roomData = { id: newId, host: myId };
              isHostRef.current = true;
            }
          }

          setRoomId(roomData.id);

          // Insert myself as a player
          const spawn = randSpawn();
          await supa.from('players').upsert({
            id: myId, room_id: roomData.id,
            username: playerData.username,
            skin: playerData.selectedSkin || 'default',
            x: spawn.x, y: spawn.y,
            health: 100, shield: 0, ammo: 35, materials: 50,
            weapons: ['pistol'], current_weapon: 'pistol',
            dead: false, kills: 0, aim_angle: 0,
            last_seen: Date.now(),
          });

          // Init local state
          stateRef.current = {
            roomId: roomData.id,
            me: {
              id: myId, username: playerData.username,
              skin: playerData.selectedSkin || 'default',
              x: spawn.x, y: spawn.y, vx:0, vy:0,
              health:100, shield:0, ammo:35, materials:50,
              weapons:['pistol'], currentWeapon:'pistol',
              dead:false, kills:0, lastShot:0, speedBoost:1, speedTimer:0,
              aimAngle:0,
            },
            players: {},   // other real players: id -> data
            bots:    {},   // bots (managed by host): id -> data
            bullets: [],
            loot:    roomData.loot || genLoot(),
            stations: roomData.stations || genStations(),
            buildings: [],
            storm:   { x:MAP_SZ/2, y:MAP_SZ/2, radius: roomData.storm_radius || MAP_SZ*0.7, targetRadius: MAP_SZ*0.08, speed:0.04 },
            timeLeft: roomData.time_left || 300,
            phase:   roomData.phase || 'waiting',
            alive:   1,
          };

          // If host, spawn bots after short delay
          if (isHostRef.current && !testMode) {
            setTimeout(async () => {
              const bots = {};
              for (let i = 0; i < 8; i++) {
                const bot = createBot('bot_'+i+'_'+roomData.id, i);
                bots[bot.id] = bot;
              }
              stateRef.current.bots = bots;
              // Publish bots
              await supa.from('rooms').update({ bots: bots }).eq('id', roomData.id);
            }, 2000);
          }

          setPhase('waiting');
          subscribeToRoom(roomData.id);
        }

        join().catch(err => {
          console.error('Join error:', err);
          setPhase('error');
        });

        return () => {
          // Cleanup
          supa.from('players').delete().eq('id', myId).then(() => {});
          channelRef.current?.unsubscribe();
          cancelAnimationFrame(renderRef.current);
          clearInterval(tickRef.current);
        };
      }, []);

      // ── Supabase Realtime subscription ──────────────────────────────────────
      function subscribeToRoom(rid) {
        const channel = supa.channel('room_' + rid, { config: { broadcast: { self: false } } });

        // Listen for player position updates
        channel.on('broadcast', { event: 'player_update' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs || payload.id === myIdRef.current) return;
          gs.players[payload.id] = { ...gs.players[payload.id], ...payload };
          setWaitPlayers(prev => {
            const exists = prev.find(p => p.id === payload.id);
            if (!exists) return [...prev, payload];
            return prev.map(p => p.id === payload.id ? { ...p, ...payload } : p);
          });
        });

        // Listen for bullets
        channel.on('broadcast', { event: 'bullet' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs) return;
          gs.bullets.push({ ...payload, traveled:0 });
        });

        // Listen for loot picked up
        channel.on('broadcast', { event: 'loot_taken' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs) return;
          gs.loot = gs.loot.filter(l => l.id !== payload.id);
        });

        // Listen for room phase changes (host broadcasts)
        channel.on('broadcast', { event: 'room_update' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs) return;
          if (payload.phase === 'countdown') {
            setPhase('countdown');
            setCountdown(payload.countdown);
          }
          if (payload.phase === 'active') {
            setPhase('active');
            gs.phase = 'active';
            if (payload.loot)     gs.loot     = payload.loot;
            if (payload.stations) gs.stations = payload.stations;
            if (payload.bots)     gs.bots     = payload.bots;
          }
          if (payload.storm)    gs.storm.radius = payload.storm;
          if (payload.timeLeft !== undefined) gs.timeLeft = payload.timeLeft;
          if (payload.bots)     gs.bots = payload.bots;
        });

        // Countdown ticks from host
        channel.on('broadcast', { event: 'countdown' }, ({ payload }) => {
          setCountdown(payload.seconds);
          if (payload.seconds <= 0) setPhase('active');
        });

        // Emotes
        channel.on('broadcast', { event: 'emote' }, ({ payload }) => {
          emoteMapRef.current[payload.id] = payload.emoji;
          setTimeout(() => { delete emoteMapRef.current[payload.id]; }, 2500);
        });

        // Player left
        channel.on('broadcast', { event: 'player_left' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs) return;
          delete gs.players[payload.id];
          setWaitPlayers(prev => prev.filter(p => p.id !== payload.id));
        });

        // Kill/death events
        channel.on('broadcast', { event: 'player_died' }, ({ payload }) => {
          const gs = stateRef.current;
          if (!gs) return;
          if (payload.id === myIdRef.current) {
            setDeathInfo({ placement: payload.placement, kills: gs.me.kills, killedBy: payload.killedBy });
            setPhase('dead');
            gs.me.dead = true;
          } else if (gs.players[payload.id]) {
            gs.players[payload.id].dead = true;
          } else if (gs.bots[payload.id]) {
            gs.bots[payload.id].dead = true;
          }
          showNotif(payload.id === myIdRef.current ? '' : `${payload.username} eliminated!`, '💀', '#6b7280');
        });

        channel.subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            channelRef.current = channel;
            // Announce presence
            channel.send({ type:'broadcast', event:'player_update', payload: {
              id: myIdRef.current, username: playerData.username,
              skin: playerData.selectedSkin || 'default',
              x: stateRef.current?.me.x, y: stateRef.current?.me.y,
              health:100, dead:false,
            }});

            // Host starts countdown after 5s
            if (isHostRef.current) {
              setTimeout(() => startCountdown(channel, rid), 5000);
            }
          }
        });
      }

      async function startCountdown(channel, rid) {
        channel.send({ type:'broadcast', event:'room_update', payload:{ phase:'countdown', countdown:10 } });
        setPhase('countdown');
        let c = 10;
        setCountdown(c);
        const iv = setInterval(async () => {
          c--;
          setCountdown(c);
          channel.send({ type:'broadcast', event:'countdown', payload:{ seconds:c } });
          if (c <= 0) {
            clearInterval(iv);
            const gs = stateRef.current;
            channel.send({ type:'broadcast', event:'room_update', payload:{
              phase:'active', loot: gs.loot, stations: gs.stations, bots: gs.bots,
            }});
            setPhase('active');
            gs.phase = 'active';
            await supa.from('rooms').update({ phase:'active' }).eq('id', rid);
          }
        }, 1000);
      }

      // ── Game tick (client-side: move self, bots if host, bullets) ───────────
      useEffect(() => {
        if (phase !== 'active') return;
        const myId = myIdRef.current;
        let lastBroadcast = 0;
        let lastShot = 0;

        tickRef.current = setInterval(() => {
          const gs = stateRef.current;
          if (!gs || gs.me.dead) return;
          const me = gs.me;
          const now = Date.now();
          const keys = keysRef.current;
          const spd = PLYR_SPD * (me.speedBoost || 1);

          // Move
          me.vx = ((keys.d?1:0)-(keys.a?1:0)) * spd;
          me.vy = ((keys.s?1:0)-(keys.w?1:0)) * spd;
          me.x  = Math.max(PLYR_SZ, Math.min(MAP_SZ-PLYR_SZ, me.x + me.vx));
          me.y  = Math.max(PLYR_SZ, Math.min(MAP_SZ-PLYR_SZ, me.y + me.vy));
          me.aimAngle = mouseRef.current.angle;

          // Speed timer
          if (me.speedTimer > 0) { me.speedTimer -= TICK_MS; if(me.speedTimer<=0) me.speedBoost=1; }

          // Storm damage
          const distFromCenter = Math.hypot(me.x-gs.storm.x, me.y-gs.storm.y);
          if (distFromCenter > gs.storm.radius) {
            me.health -= 0.3;
            if (me.health <= 0) { me.health=0; diePlayer('Storm'); }
          }

          // Shoot
          const w = WEP[me.currentWeapon];
          if (mouseRef.current.down && w && me.ammo >= w.ammo && now - me.lastShot > w.rate && !triviaRef.current) {
            me.lastShot = now;
            me.ammo -= w.ammo;
            const bullet = {
              id: myId+'_b_'+now,
              ownerId: myId, ownerName: playerData.username,
              x: me.x, y: me.y,
              vx: Math.cos(me.aimAngle)*BULL_SPD,
              vy: Math.sin(me.aimAngle)*BULL_SPD,
              dmg: w.dmg, range: w.range, weapon: me.currentWeapon,
              col: w.col, traveled:0,
            };
            gs.bullets.push(bullet);
            channelRef.current?.send({ type:'broadcast', event:'bullet', payload: bullet });
          }

          // Loot pickup
          gs.loot = gs.loot.filter(item => {
            if (Math.hypot(me.x-item.x, me.y-item.y) < PLYR_SZ+18) {
              applyLoot(me, item);
              channelRef.current?.send({ type:'broadcast', event:'loot_taken', payload:{ id:item.id } });
              showNotif(item.type==='weapon'?(WEP[item.weapon]?.name||'Weapon')+' picked up!':'Got '+item.type,'📦','#a78bfa');
              return false;
            }
            return true;
          });

          // Trivia station
          if (keys.e) {
            gs.stations.forEach(st => {
              if (!st.used && Math.hypot(me.x-st.x, me.y-st.y) < st.radius+PLYR_SZ) {
                st.used = true;
                const q = TRIVIA_Q[Math.floor(Math.random()*TRIVIA_Q.length)];
                triviaRef.current = { q };
                setTriviaPopup({ q });
                keysRef.current.e = false;
              }
            });
          }

          // Build
          if (keys.b && me.materials >= 10) {
            me.materials -= 10;
            gs.buildings.push({ id:'b_'+now, x:me.x+Math.cos(me.aimAngle)*65, y:me.y+Math.sin(me.aimAngle)*65, w:65,h:16,angle:me.aimAngle,health:120 });
            keysRef.current.b = false;
          }

          // Move bullets + check hits
          const allEntities = { ...gs.players, ...gs.bots };
          gs.bullets = gs.bullets.filter(b => {
            b.x += b.vx; b.y += b.vy; b.traveled += Math.hypot(b.vx,b.vy);
            if (b.traveled>b.range||b.x<0||b.x>MAP_SZ||b.y<0||b.y>MAP_SZ) return false;
            // Hit self if bullet from others
            if (b.ownerId !== myId && !me.dead && Math.hypot(b.x-me.x,b.y-me.y)<PLYR_SZ) {
              if (me.shield>0) me.shield=Math.max(0,me.shield-b.dmg);
              else me.health -= b.dmg;
              if (me.health<=0) diePlayer(b.ownerName);
              return false;
            }
            // Hit other bots if I'm host
            if (isHostRef.current && b.ownerId === myId) {
              for (const bot of Object.values(gs.bots)) {
                if (!bot.dead && Math.hypot(b.x-bot.x,b.y-bot.y)<PLYR_SZ) {
                  bot.health -= b.dmg;
                  if (bot.health<=0) {
                    bot.dead=true; me.kills++;
                    channelRef.current?.send({ type:'broadcast', event:'player_died', payload:{ id:bot.id, username:bot.username, killedBy:playerData.username, placement:0 }});
                    showNotif(`Eliminated ${bot.username}!`,'💀','#ef4444');
                  }
                  return false;
                }
              }
            }
            return true;
          });

          // Host: tick bots
          if (isHostRef.current) {
            Object.values(gs.bots).forEach(bot => {
              if (bot.dead) return;
              tickBot(bot, gs, now);
            });
            // Storm shrink (host authoritative)
            if (gs.storm.radius > gs.storm.targetRadius) {
              gs.storm.radius -= gs.storm.speed;
              if (now % 5000 < TICK_MS) { // broadcast storm every 5s
                channelRef.current?.send({ type:'broadcast', event:'room_update', payload:{ storm: gs.storm.radius, timeLeft: gs.timeLeft }});
              }
            }
            gs.timeLeft -= TICK_MS/1000;
            if (gs.timeLeft <= 0) endMatch();
          }

          // Broadcast my position every 50ms
          if (now - lastBroadcast > 50) {
            lastBroadcast = now;
            channelRef.current?.send({ type:'broadcast', event:'player_update', payload:{
              id:myId, username:playerData.username, skin:me.skin||playerData.selectedSkin||'default',
              x:Math.round(me.x), y:Math.round(me.y), health:me.health, shield:me.shield,
              dead:me.dead, kills:me.kills, aimAngle:me.aimAngle, currentWeapon:me.currentWeapon,
            }});
          }

          // Count alive
          const aliveCount = 1 + Object.values(gs.players).filter(p=>!p.dead).length + Object.values(gs.bots).filter(b=>!b.dead).length;
          gs.alive = aliveCount;

          // Update HUD
          setHud({ health:Math.max(0,Math.round(me.health)), shield:Math.round(me.shield||0), ammo:me.ammo, materials:me.materials, weapon:me.currentWeapon, weapons:me.weapons, alive:aliveCount, kills:me.kills, timeLeft:Math.round(gs.timeLeft) });

          // Win check
          if (aliveCount <= 1 && !me.dead) endMatch(true);

        }, TICK_MS);

        return () => clearInterval(tickRef.current);
      }, [phase]);

      function tickBot(bot, gs, now) {
        // Simple bot AI
        bot.moveTimer -= TICK_MS;
        const enemies = Object.values(gs.players).filter(p=>!p.dead);
        const me = gs.me;
        const allEnemies = [...enemies, (!me.dead ? [me] : [])].flat();
        let nearest=null, nd=Infinity;
        allEnemies.forEach(e => { const d=Math.hypot(e.x-bot.x,e.y-bot.y); if(d<nd){nd=d;nearest=e;} });
        const w = WEP[bot.currentWeapon]||WEP.pistol;
        if (nearest && nd < w.range*0.9) {
          const a = Math.atan2(nearest.y-bot.y,nearest.x-bot.x);
          bot.vx=Math.cos(a)*PLYR_SPD*0.7; bot.vy=Math.sin(a)*PLYR_SPD*0.7;
          bot.aimAngle=a;
          if (now-bot.lastShot > w.rate*1.5) {
            bot.lastShot=now;
            const spread=(Math.random()-0.5)*0.3;
            const bullet={id:bot.id+'_b_'+now,ownerId:bot.id,ownerName:bot.username,x:bot.x,y:bot.y,vx:Math.cos(a+spread)*BULL_SPD,vy:Math.sin(a+spread)*BULL_SPD,dmg:w.dmg*0.7,range:w.range,weapon:bot.currentWeapon,col:w.col,traveled:0};
            gs.bullets.push(bullet);
            channelRef.current?.send({ type:'broadcast', event:'bullet', payload:bullet });
          }
        } else if (bot.moveTimer<=0) {
          const a=Math.random()*Math.PI*2; bot._vx=Math.cos(a)*PLYR_SPD*0.5; bot._vy=Math.sin(a)*PLYR_SPD*0.5;
          bot.moveTimer=1500+Math.random()*2000;
        }
        if (!nearest||nd>=w.range){bot.vx=bot._vx||0;bot.vy=bot._vy||0;}
        const dc=Math.hypot(bot.x-gs.storm.x,bot.y-gs.storm.y);
        if(dc>gs.storm.radius*0.85){const a=Math.atan2(gs.storm.y-bot.y,gs.storm.x-bot.x);bot.vx=Math.cos(a)*PLYR_SPD;bot.vy=Math.sin(a)*PLYR_SPD;}
        bot.x=Math.max(PLYR_SZ,Math.min(MAP_SZ-PLYR_SZ,bot.x+(bot.vx||0)));
        bot.y=Math.max(PLYR_SZ,Math.min(MAP_SZ-PLYR_SZ,bot.y+(bot.vy||0)));
        if(dc>gs.storm.radius){bot.health-=0.3;if(bot.health<=0){bot.dead=true;channelRef.current?.send({type:'broadcast',event:'player_died',payload:{id:bot.id,username:bot.username,killedBy:'Storm',placement:0}});}}
      }

      function applyLoot(me, item) {
        if (item.type==='weapon'&&item.weapon&&!me.weapons.includes(item.weapon)) me.weapons.push(item.weapon);
        else if(item.type==='ammo') me.ammo=Math.min(999,me.ammo+item.value);
        else if(item.type==='materials') me.materials=Math.min(999,me.materials+item.value);
        else if(item.type==='health') me.health=Math.min(100,me.health+item.value);
      }

      function diePlayer(killedBy) {
        const gs = stateRef.current;
        if (!gs || gs.me.dead) return;
        gs.me.dead = true;
        const placement = gs.alive;
        setDeathInfo({ placement, kills: gs.me.kills, killedBy });
        setPhase('dead');
        channelRef.current?.send({ type:'broadcast', event:'player_died', payload:{ id:myIdRef.current, username:playerData.username, killedBy, placement }});
      }

      function endMatch(won=false) {
        const gs = stateRef.current;
        if (!gs) return;
        setTimeout(() => onEnd({ placement: won?1:gs.alive, kills:gs.me.kills, coinsEarned:gs.me.kills*50+(won?250:0), xpEarned:gs.me.kills*25+(won?120:15) }), 1000);
      }

      function handleTriviaAnswer(idx) {
        if (!triviaPopup) return;
        const correct = idx === triviaPopup.q.c;
        if (correct) {
          const me = stateRef.current?.me;
          if (me) {
            const rewards = [
              ()=>{me.shield=Math.min(100,me.shield+50);return'Shield +50 🛡️';},
              ()=>{me.health=Math.min(100,me.health+50);return'Health +50 💖';},
              ()=>{me.ammo+=30;return'Ammo +30 📦';},
              ()=>{me.materials+=50;return'Materials +50 🧱';},
              ()=>{me.speedBoost=1.5;me.speedTimer=8000;return'Speed Boost ⚡';},
            ];
            const msg = rewards[Math.floor(Math.random()*rewards.length)]();
            showNotif(msg+' — Correct!','🧠','#10b981');
          }
        } else { showNotif('Wrong answer!','❌','#ef4444'); }
        triviaRef.current = null;
        setTriviaPopup(null);
      }

      // ── Canvas render ────────────────────────────────────────────────────────
      useEffect(() => {
        if (phase !== 'active' && phase !== 'dead') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const render = () => {
          const gs = stateRef.current;
          if (!gs) { renderRef.current=requestAnimationFrame(render); return; }
          const me = gs.me;
          const camX = me.x - canvas.width/2;
          const camY = me.y - canvas.height/2;

          // Background
          const bg = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
          bg.addColorStop(0,'#1e293b'); bg.addColorStop(1,'#0f172a');
          ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);

          // Grid
          ctx.strokeStyle='rgba(139,92,246,0.08)'; ctx.lineWidth=1;
          const gs2=100;
          for(let x=(-camX%gs2);x<canvas.width;x+=gs2){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
          for(let y=(-camY%gs2);y<canvas.height;y+=gs2){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}

          // Storm
          ctx.save();
          ctx.beginPath(); ctx.rect(0,0,canvas.width,canvas.height);
          ctx.arc(gs.storm.x-camX,gs.storm.y-camY,gs.storm.radius,0,Math.PI*2,true);
          ctx.fillStyle='rgba(139,92,246,0.38)'; ctx.fill(); ctx.restore();
          ctx.strokeStyle='#a78bfa'; ctx.lineWidth=4; ctx.setLineDash([20,10]);
          ctx.beginPath(); ctx.arc(gs.storm.x-camX,gs.storm.y-camY,gs.storm.radius,0,Math.PI*2); ctx.stroke();
          ctx.setLineDash([]);

          // Trivia stations
          gs.stations.forEach(st => {
            const sx=st.x-camX,sy=st.y-camY;
            if(sx<-100||sx>canvas.width+100||sy<-100||sy>canvas.height+100) return;
            const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,st.radius+20);
            glow.addColorStop(0,st.used?'rgba(80,80,80,0.3)':'rgba(236,72,153,0.35)'); glow.addColorStop(1,'transparent');
            ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,st.radius+20,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(sx,sy,st.radius,0,Math.PI*2);
            ctx.fillStyle=st.used?'rgba(80,80,80,0.5)':'rgba(236,72,153,0.55)'; ctx.fill();
            ctx.strokeStyle=st.used?'#555':'#ec4899'; ctx.lineWidth=4; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.font='bold 26px Arial'; ctx.textAlign='center';
            ctx.fillText(st.used?'✓':'🧠',sx,sy+9);
            if(!st.used && Math.hypot(me.x-st.x,me.y-st.y)<st.radius+PLYR_SZ){
              ctx.fillStyle='#ec4899'; ctx.font='bold 12px Arial'; ctx.fillText('Press E',sx,sy-st.radius-8);
            }
          });

          // Loot
          const LOOT_COL={weapon:'#fbbf24',ammo:'#a78bfa',materials:'#fb923c',health:'#f472b6'};
          gs.loot.forEach(item => {
            const lx=item.x-camX,ly=item.y-camY;
            if(lx<-30||lx>canvas.width+30||ly<-30||ly>canvas.height+30) return;
            const col=LOOT_COL[item.type]||'#fff';
            ctx.shadowColor=col; ctx.shadowBlur=14;
            ctx.beginPath(); ctx.arc(lx,ly,17,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
            ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='13px Arial'; ctx.textAlign='center';
            ctx.fillText(item.type==='weapon'?(WEP[item.weapon]?.icon||'🔫'):{ammo:'📦',materials:'🧱',health:'💖'}[item.type]||'?',lx,ly+5);
          });

          // Buildings
          gs.buildings.forEach(bld=>{
            ctx.save(); ctx.translate(bld.x-camX,bld.y-camY); ctx.rotate(bld.angle);
            ctx.fillStyle=`rgba(251,146,60,${0.4+(bld.health/120)*0.6})`; ctx.shadowColor='#fb923c'; ctx.shadowBlur=8;
            ctx.fillRect(-bld.w/2,-bld.h/2,bld.w,bld.h); ctx.shadowBlur=0;
            ctx.strokeStyle='#fed7aa'; ctx.lineWidth=2; ctx.strokeRect(-bld.w/2,-bld.h/2,bld.w,bld.h);
            ctx.restore();
          });

          // Draw all entities
          const toDraw = [
            ...Object.values(gs.players),
            ...Object.values(gs.bots),
          ];
          toDraw.forEach(p => {
            if(p.dead) return;
            const px=p.x-camX,py=p.y-camY;
            if(px<-60||px>canvas.width+60||py<-60||py>canvas.height+60) return;
            const col=SKIN_COLORS[p.skin]||(p.isBot?'#ef4444':'#8b5cf6');
            const emoji=p.isBot?'😈':(SKIN_EMOJI[p.skin]||'😎');
            ctx.shadowColor=col; ctx.shadowBlur=14;
            ctx.beginPath(); ctx.arc(px,py,PLYR_SZ,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
            ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2.5; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.font='17px Arial'; ctx.textAlign='center'; ctx.fillText(emoji,px,py+6);
            const emoteEmoji=emoteMapRef.current[p.id];
            if(emoteEmoji){ctx.font='28px Arial';ctx.fillText(emoteEmoji,px,py-52);}
            ctx.font='bold 11px Arial'; ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.fillText(p.username,px,py-37);
            ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(px-26,py-33,52,7);
            ctx.fillStyle=p.health>50?'#10b981':p.health>25?'#fbbf24':'#ef4444';
            ctx.fillRect(px-26,py-33,52*(Math.max(0,p.health)/100),7);
          });

          // Draw self
          if (!me.dead) {
            const px=me.x-camX, py=me.y-camY;
            const col=SKIN_COLORS[playerData.selectedSkin]||'#8b5cf6';
            const emoji=SKIN_EMOJI[playerData.selectedSkin]||'😎';
            ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
            ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(me.aimAngle)*65,py+Math.sin(me.aimAngle)*65); ctx.stroke(); ctx.setLineDash([]);
            ctx.shadowColor=col; ctx.shadowBlur=22;
            ctx.beginPath(); ctx.arc(px,py,PLYR_SZ,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
            ctx.shadowBlur=0; ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.font='18px Arial'; ctx.textAlign='center'; ctx.fillText(emoji,px,py+6);
            if(aimbotMode){ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(px,py,PLYR_SZ+8,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
          }

          // Bullets
          gs.bullets.forEach(b=>{
            const col=WEP[b.weapon]?.col||'#a78bfa';
            ctx.shadowColor=col; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
            ctx.shadowBlur=0;
          });

          renderRef.current=requestAnimationFrame(render);
        };
        renderRef.current=requestAnimationFrame(render);
        return ()=>cancelAnimationFrame(renderRef.current);
      }, [phase]);

      // ── Controls ─────────────────────────────────────────────────────────────
      useEffect(() => {
        const canvas = canvasRef.current;
        const onKD=(e)=>{
          keysRef.current[e.key.toLowerCase()]=true;
          if(e.key.toLowerCase()==='t'){
            const em=['👋','💃','😂','💪','🎮','🔥'][Math.floor(Math.random()*6)];
            channelRef.current?.send({type:'broadcast',event:'emote',payload:{id:myIdRef.current,emoji:em}});
          }
          const wk={'1':0,'2':1,'3':2,'4':3};
          if(wk[e.key]!==undefined){
            const me=stateRef.current?.me;
            if(me&&me.weapons[wk[e.key]]) me.currentWeapon=me.weapons[wk[e.key]];
          }
        };
        const onKU=(e)=>{keysRef.current[e.key.toLowerCase()]=false;};
        const onMM=(e)=>{
          if(!canvas) return;
          const r=canvas.getBoundingClientRect();
          mouseRef.current.x=e.clientX-r.left; mouseRef.current.y=e.clientY-r.top;
          mouseRef.current.angle=Math.atan2(e.clientY-r.top-canvas.height/2,e.clientX-r.left-canvas.width/2);
        };
        const onMD=()=>{mouseRef.current.down=true;};
        const onMU=()=>{mouseRef.current.down=false;};
        const onWH=(e)=>{
          const me=stateRef.current?.me;
          if(!me||me.weapons.length<2) return;
          const idx=me.weapons.indexOf(me.currentWeapon);
          me.currentWeapon=me.weapons[(idx+(e.deltaY>0?1:-1)+me.weapons.length)%me.weapons.length];
        };
        window.addEventListener('keydown',onKD); window.addEventListener('keyup',onKU);
        canvas?.addEventListener('mousemove',onMM); canvas?.addEventListener('mousedown',onMD);
        canvas?.addEventListener('mouseup',onMU); canvas?.addEventListener('wheel',onWH);
        return()=>{
          window.removeEventListener('keydown',onKD); window.removeEventListener('keyup',onKU);
          canvas?.removeEventListener('mousemove',onMM); canvas?.removeEventListener('mousedown',onMD);
          canvas?.removeEventListener('mouseup',onMU); canvas?.removeEventListener('wheel',onWH);
        };
      }, [phase]);

      const formatTime=(s)=>`${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;

      // ── Screens ───────────────────────────────────────────────────────────────
      if(phase==='joining') return (
        <div style={styles.gameWrapper}>
          <div style={{color:'#fff',textAlign:'center'}}>
            <div style={{fontSize:'3rem',animation:'spin 1s linear infinite',display:'inline-block',marginBottom:'16px'}}>🎮</div>
            <div style={{fontSize:'1.3rem',fontWeight:700}}>Joining game...</div>
            <div style={{color:'#a5b4fc',marginTop:'8px',fontSize:'0.9rem'}}>Connecting to Pixel Zone</div>
