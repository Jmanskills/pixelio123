<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Zone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; overflow: hidden; }
    #root { width: 100%; min-height: 100vh; }
    @keyframes floatAround {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(30px, -30px) rotate(90deg); }
      50% { transform: translate(-20px, 20px) rotate(180deg); }
      75% { transform: translate(-30px, -20px) rotate(270deg); }
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes devGlow {
      0%, 100% { box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff8844; }
      50% { box-shadow: 0 0 40px #00ff88, 0 0 80px #00ff8866; }
    }
    @keyframes adminPulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.5; }
    }
    @keyframes testBanner {
      0%, 100% { background: rgba(239,68,68,0.9); } 50% { background: rgba(220,38,38,0.9); }
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97) !important; }
    input:focus { border-color: #8b5cf6 !important; box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ============== CONSTANTS ==============
    const MAP_SIZE = 2000;
    const PLAYER_SIZE = 30;
    const PLAYER_SPEED = 4;
    const BULLET_SPEED = 12;
    const BOT_COUNT = 15;
    const TRIVIA_STATION_COUNT = 5;
    const LOOT_COUNT = 20;
    const OWNER_USERNAME = 'jmanskills';

    const WEAPONS = {
      pistol:   { name: 'Pistol',     damage: 15, fireRate: 400,  ammoUse: 1, range: 300, icon: '🔫', color: '#a78bfa' },
      shotgun:  { name: 'Shotgun',    damage: 40, fireRate: 800,  ammoUse: 2, range: 150, icon: '💥', color: '#f472b6' },
      rifle:    { name: 'Rifle',      damage: 25, fireRate: 200,  ammoUse: 1, range: 400, icon: '🎯', color: '#60a5fa' },
      sniper:   { name: 'Sniper',     damage: 75, fireRate: 1500, ammoUse: 1, range: 600, icon: '🔭', color: '#34d399' },
      smg:      { name: 'SMG',        damage: 10, fireRate: 100,  ammoUse: 1, range: 200, icon: '🌀', color: '#f59e0b' },
      rocket:   { name: 'Rocket',     damage: 90, fireRate: 2000, ammoUse: 3, range: 500, icon: '🚀', color: '#ef4444' },
      laser:    { name: 'Laser',      damage: 20, fireRate: 150,  ammoUse: 1, range: 450, icon: '🔆', color: '#06b6d4' },
      grenade:  { name: 'Grenade',    damage: 60, fireRate: 1200, ammoUse: 2, range: 350, icon: '💣', color: '#84cc16' },
      crossbow: { name: 'Crossbow',   damage: 55, fireRate: 900,  ammoUse: 1, range: 380, icon: '🏹', color: '#8b5cf6' },
      minigun:  { name: 'Minigun',    damage: 8,  fireRate: 60,   ammoUse: 1, range: 280, icon: '⚙️', color: '#fb923c' },
    };

    const TRIVIA_QUESTIONS = [
      { q: "What planet is known as the Red Planet?", a: ["Mars","Venus","Jupiter","Mercury"], correct: 0 },
      { q: "How many sides does a hexagon have?", a: ["5","6","7","8"], correct: 1 },
      { q: "What is the largest ocean?", a: ["Atlantic","Pacific","Indian","Arctic"], correct: 1 },
      { q: "Who wrote Romeo and Juliet?", a: ["Dickens","Shakespeare","Twain","Austen"], correct: 1 },
      { q: "What is 15 × 8?", a: ["110","115","120","125"], correct: 2 },
      { q: "What gas do plants breathe in?", a: ["Oxygen","Nitrogen","CO2","Hydrogen"], correct: 2 },
      { q: "How many continents are there?", a: ["5","6","7","8"], correct: 2 },
      { q: "What is the capital of Japan?", a: ["Seoul","Beijing","Tokyo","Bangkok"], correct: 2 },
      { q: "Which animal is the fastest?", a: ["Lion","Cheetah","Horse","Falcon"], correct: 1 },
      { q: "What year did WW2 end?", a: ["1943","1944","1945","1946"], correct: 2 },
      { q: "What is the chemical symbol for water?", a: ["H2O","CO2","NaCl","O2"], correct: 0 },
      { q: "How many players on a soccer team?", a: ["9","10","11","12"], correct: 2 },
      { q: "What is the largest planet?", a: ["Saturn","Jupiter","Neptune","Uranus"], correct: 1 },
      { q: "Who painted the Mona Lisa?", a: ["Picasso","Da Vinci","Van Gogh","Monet"], correct: 1 },
      { q: "What is 144 ÷ 12?", a: ["10","11","12","14"], correct: 2 },
    ];

    const POWERUPS = [
      { name: 'Shield Boost', effect: 'shield',    value: 50,  icon: '🛡️', color: '#60a5fa' },
      { name: 'Speed Boost',  effect: 'speed',     value: 1.5, duration: 10000, icon: '⚡', color: '#fbbf24' },
      { name: 'Health Pack',  effect: 'health',    value: 50,  icon: '💖', color: '#f472b6' },
      { name: 'Ammo Crate',   effect: 'ammo',      value: 30,  icon: '📦', color: '#a78bfa' },
      { name: 'Material Bonus', effect: 'materials', value: 50, icon: '🧱', color: '#fb923c' },
    ];

    const SKINS = [
      { id: 'default',  name: 'Rookie',    color: '#8b5cf6', price: 0,    owned: true,  emoji: '😎' },
      { id: 'bubblegum',name: 'Bubblegum', color: '#ec4899', price: 500,  owned: false, emoji: '🍬' },
      { id: 'mint',     name: 'Mint',      color: '#10b981', price: 500,  owned: false, emoji: '🌿' },
      { id: 'ocean',    name: 'Ocean',     color: '#0ea5e9', price: 750,  owned: false, emoji: '🌊' },
      { id: 'sunset',   name: 'Sunset',    color: '#f97316', price: 1000, owned: false, emoji: '🌅' },
      { id: 'golden',   name: 'Golden',    color: '#eab308', price: 2000, owned: false, emoji: '⭐' },
      { id: 'galaxy',   name: 'Galaxy',    color: '#6366f1', price: 1500, owned: false, emoji: '🌌' },
      { id: 'cherry',   name: 'Cherry',    color: '#ef4444', price: 1000, owned: false, emoji: '🍒' },
      { id: 'pug_taco', name: 'Pug Taco',  color: '#d97706', price: 800,  owned: false, emoji: '🌮', special: true },
    ];

    const EMOTES = [
      { id: 'wave',  name: 'Wave',     emoji: '👋', price: 0,   owned: true  },
      { id: 'dance', name: 'Dance',    emoji: '💃', price: 300, owned: false },
      { id: 'laugh', name: 'Laugh',    emoji: '😂', price: 200, owned: false },
      { id: 'flex',  name: 'Flex',     emoji: '💪', price: 400, owned: false },
      { id: 'gg',    name: 'GG',       emoji: '🎮', price: 300, owned: false },
      { id: 'brain', name: 'Big Brain',emoji: '🧠', price: 500, owned: false },
    ];

    // ============== SAVE SYSTEM (Supabase) ==============
    const AUTH_KEY   = 'pz_auth_v1';
    const ADMINS_KEY = 'pz_admins_v1';

    // Simple hash (not cryptographic — just obfuscation for game passwords)
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + 'pixelzone_salt_2024');
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function saveGame(data) {
      // Always cache locally for speed
      try { localStorage.setItem('pz_save_' + data.username, JSON.stringify({ ...data, lastSaved: new Date().toISOString() })); } catch(e) {}
      // Sync to Supabase
      if (!data.username.startsWith('Guest')) {
        await supa.from('accounts').update({
          coins:         data.coins,
          xp:            data.xp,
          level:         data.level,
          skins:         data.skins,
          emotes:        data.emotes,
          selected_skin: data.selectedSkin,
          selected_emote:data.selectedEmote,
          stats:         data.stats,
          last_login:    new Date().toISOString(),
        }).eq('username', data.username);
      }
    }

    function loadAuth() {
      try { const r = localStorage.getItem(AUTH_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
    }

    function saveAuth(auth) {
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch(e) {}
    }

    function rowToPlayerData(row) {
      return {
        username:      row.username,
        coins:         row.coins      ?? 1000,
        xp:            row.xp         ?? 0,
        level:         row.level      ?? 1,
        skins:         row.skins      ?? ['default'],
        emotes:        row.emotes     ?? ['wave'],
        selectedSkin:  row.selected_skin  || 'default',
        selectedEmote: row.selected_emote || 'wave',
        stats:         row.stats      ?? { wins:0, kills:0, gamesPlayed:0 },
      };
    }

    const PERMANENT_ADMINS = [OWNER_USERNAME, 'zen'];

    function getAdmins() {
      try {
        const raw = localStorage.getItem(ADMINS_KEY);
        const stored = raw ? JSON.parse(raw) : [];
        return [...new Set([...PERMANENT_ADMINS, ...stored])];
      } catch(e) { return PERMANENT_ADMINS; }
    }

    function saveAdmins(list) {
      try { localStorage.setItem(ADMINS_KEY, JSON.stringify(list)); } catch(e) {}
    }

    // Supabase account helpers
    async function getAccounts() {
      const { data } = await supa.from('accounts').select('username, coins, xp, level, skins, selected_skin, stats').order('username');
      return data || [];
    }

    async function deleteAccount(username) {
      await supa.from('accounts').delete().eq('username', username);
    }

    function isOwner(username) { return username === OWNER_USERNAME; }
    function isPermanentAdmin(username) { return PERMANENT_ADMINS.includes(username); }
    function isAdmin(username) { return getAdmins().includes(username) || isOwner(username); }

    function makeDefaultPlayer(username) {
      return {
        username,
        level: 1, xp: 0, coins: 1000,
        selectedSkin: 'default', selectedEmote: 'wave',
        skins: ['default'], emotes: ['wave'],
        stats: { wins: 0, kills: 0, gamesPlayed: 0 }
      };
    }

    // ============== FLOATING SHAPES ==============
    function FloatingShapes({ count = 15, colors = ['#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b'] }) {
      const shapes = useRef([...Array(count)].map((_, i) => ({
        id: i, x: Math.random()*100, y: Math.random()*100,
        size: 20 + Math.random()*60,
        color: colors[Math.floor(Math.random()*colors.length)],
        duration: 15 + Math.random()*20, delay: Math.random()*-20,
        type: ['circle','square','triangle'][Math.floor(Math.random()*3)]
      })));
      return (
        <div style={styles.floatingContainer}>
          {shapes.current.map(shape => (
            <div key={shape.id} style={{
              position:'absolute', left:`${shape.x}%`, top:`${shape.y}%`,
              width: shape.size, height: shape.size,
              background: shape.type !== 'triangle' ? shape.color : 'transparent',
              borderRadius: shape.type==='circle' ? '50%' : shape.type==='square' ? '12px' : '0',
              borderLeft: shape.type==='triangle' ? `${shape.size/2}px solid transparent` : 'none',
              borderRight: shape.type==='triangle' ? `${shape.size/2}px solid transparent` : 'none',
              borderBottom: shape.type==='triangle' ? `${shape.size}px solid ${shape.color}` : 'none',
              opacity: 0.15,
              animation: `floatAround ${shape.duration}s ease-in-out infinite`,
              animationDelay: `${shape.delay}s`, pointerEvents:'none',
            }} />
          ))}
        </div>
      );
    }

    // ============== AUTH SCREEN ==============
    function AuthScreen({ onLogin }) {
      const [mode, setMode]       = useState('login');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [confirm, setConfirm]   = useState('');
      const [error, setError]       = useState('');
      const [success, setSuccess]   = useState('');
      const [loading, setLoading]   = useState(false);

      const handleLogin = async () => {
        setError(''); setLoading(true);
        if (!username.trim() || !password) { setLoading(false); return setError('Please fill in all fields.'); }
        try {
          const hash = await hashPassword(password);
          const { data: acc } = await supa.from('accounts').select('*').eq('username', username.trim()).single();
          if (!acc) { setLoading(false); return setError('Account not found. Sign up first!'); }
          if (acc.password_hash !== hash) { setLoading(false); return setError('Wrong password.'); }
          // Update last login
          await supa.from('accounts').update({ last_login: new Date().toISOString() }).eq('username', acc.username);
          saveAuth({ username: acc.username });
          onLogin(rowToPlayerData(acc));
        } catch(e) {
          setLoading(false); setError('Connection error. Try again.');
        }
      };

      const handleSignup = async () => {
        setError(''); setLoading(true);
        if (!username.trim() || !password || !confirm) { setLoading(false); return setError('Please fill in all fields.'); }
        if (username.trim().length < 3) { setLoading(false); return setError('Username must be at least 3 characters.'); }
        if (password.length < 6) { setLoading(false); return setError('Password must be at least 6 characters.'); }
        if (password !== confirm) { setLoading(false); return setError('Passwords do not match.'); }
        try {
          // Check if username taken
          const { data: existing } = await supa.from('accounts').select('username').eq('username', username.trim()).single();
          if (existing) { setLoading(false); return setError('Username already taken!'); }
          const hash = await hashPassword(password);
          const newAcc = {
            username:      username.trim(),
            password_hash: hash,
            coins: 1000, xp: 0, level: 1,
            skins: ['default'], emotes: ['wave'],
            selected_skin: 'default', selected_emote: 'wave',
            stats: { wins:0, kills:0, gamesPlayed:0 },
          };
          const { error: insertErr } = await supa.from('accounts').insert(newAcc);
          if (insertErr) { setLoading(false); return setError('Could not create account. Try again.'); }
          setSuccess('Account created! Logging in...');
          saveAuth({ username: username.trim() });
          setTimeout(() => onLogin(makeDefaultPlayer(username.trim())), 800);
        } catch(e) {
          setLoading(false); setError('Connection error. Try again.');
        }
      };

      const handleGuest = () => {
        const guestName = 'Guest' + Math.floor(Math.random() * 9999);
        onLogin(makeDefaultPlayer(guestName));
      };

      return (
        <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%)', position:'relative', padding:'20px' }}>
          <FloatingShapes />
          <div style={{ position:'relative', zIndex:1, background:'rgba(255,255,255,0.08)', backdropFilter:'blur(20px)', borderRadius:'30px', padding:'40px', maxWidth:'420px', width:'100%', border:'2px solid rgba(255,255,255,0.15)' }}>
            <div style={{ textAlign:'center', marginBottom:'30px' }}>
              <div style={{ fontSize:'3rem', marginBottom:'8px', animation:'bounce 2s infinite' }}>🎮⚡</div>
              <h1 style={{ fontSize:'2rem', fontWeight:900, color:'#fff', margin:0 }}>
                <span style={{ color:'#c4b5fd' }}>Pixel</span><span style={{ color:'#fbbf24' }}>Zone</span>
              </h1>
              <div style={{ color:'#a5b4fc', fontSize:'0.9rem', marginTop:'4px' }}>Drop in. Build. Fight. Win!</div>
            </div>

            <div style={{ display:'flex', gap:'8px', marginBottom:'25px' }}>
              {['login','signup'].map(m => (
                <button key={m} onClick={() => { setMode(m); setError(''); setSuccess(''); }} style={{
                  flex:1, padding:'12px', fontSize:'1rem', fontWeight:700, fontFamily:'inherit',
                  background: mode===m ? 'linear-gradient(135deg,#8b5cf6,#7c3aed)' : 'rgba(255,255,255,0.08)',
                  border:'none', borderRadius:'15px', color:'#fff', cursor:'pointer',
                  boxShadow: mode===m ? '0 5px 20px rgba(139,92,246,0.4)' : 'none'
                }}>
                  {m === 'login' ? '🔑 Login' : '✨ Sign Up'}
                </button>
              ))}
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
              <input type="text" placeholder="Username" value={username}
                onChange={e => setUsername(e.target.value)}
                style={{ padding:'14px 18px', fontSize:'1rem', fontFamily:'inherit', background:'rgba(255,255,255,0.1)', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'15px', color:'#fff', outline:'none' }}
              />
              <input type="password" placeholder="Password" value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key==='Enter' && !loading && (mode==='login' ? handleLogin() : handleSignup())}
                style={{ padding:'14px 18px', fontSize:'1rem', fontFamily:'inherit', background:'rgba(255,255,255,0.1)', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'15px', color:'#fff', outline:'none' }}
              />
              {mode === 'signup' && (
                <input type="password" placeholder="Confirm Password" value={confirm}
                  onChange={e => setConfirm(e.target.value)}
                  style={{ padding:'14px 18px', fontSize:'1rem', fontFamily:'inherit', background:'rgba(255,255,255,0.1)', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'15px', color:'#fff', outline:'none' }}
                />
              )}
            </div>

            {error   && <div style={{ color:'#f87171', fontSize:'0.9rem', marginTop:'10px', textAlign:'center' }}>{error}</div>}
            {success && <div style={{ color:'#34d399', fontSize:'0.9rem', marginTop:'10px', textAlign:'center' }}>{success}</div>}

            <button onClick={mode==='login' ? handleLogin : handleSignup} disabled={loading} style={{
              width:'100%', marginTop:'20px', padding:'16px', fontSize:'1.1rem', fontWeight:800,
              fontFamily:'inherit', background: loading ? 'rgba(139,92,246,0.5)' : 'linear-gradient(135deg,#8b5cf6,#7c3aed)',
              border:'none', borderRadius:'20px', color:'#fff', cursor: loading ? 'not-allowed' : 'pointer',
              boxShadow:'0 8px 25px rgba(139,92,246,0.4)'
            }}>
              {loading ? '⏳ Please wait...' : mode==='login' ? '🚀 Login' : '🎉 Create Account'}
            </button>

            <div style={{ textAlign:'center', marginTop:'15px' }}>
              <button onClick={handleGuest} style={{
                background:'none', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'15px',
                color:'rgba(255,255,255,0.6)', padding:'10px 25px', fontSize:'0.9rem', cursor:'pointer', fontFamily:'inherit'
              }}>👤 Play as Guest (no save)</button>
            </div>
          </div>
        </div>
      );
    }

    // ============== ADMIN PANEL ==============
    function AdminPanel({ playerData, setPlayerData, onClose, testMode, setTestMode, aimbotMode, setAimbotMode }) {
      const [tab, setTab] = useState('tools');
      const [newAdmin, setNewAdmin] = useState('');
      const [adminMsg, setAdminMsg] = useState('');
      const [giveTarget, setGiveTarget] = useState('');
      const [giveCoins, setGiveCoins] = useState(500);
      const [spawnMsg, setSpawnMsg] = useState('');
      const [deleteConfirm, setDeleteConfirm] = useState(null); // username to confirm delete
      const [deleteMsg, setDeleteMsg] = useState('');
      const [accountSearch, setAccountSearch] = useState('');

      const deleteMsg_placeholder = null; // deleteAccount is now global async fn

      const admins = getAdmins();
      const owner = isOwner(playerData.username);

      const promoteAdmin = () => {
        if (!newAdmin.trim()) return;
        if (admins.includes(newAdmin.trim())) return setAdminMsg(`${newAdmin} is already an admin.`);
        const updated = [...admins, newAdmin.trim()];
        saveAdmins(updated);
        setAdminMsg(`✅ ${newAdmin} is now an admin!`);
        setNewAdmin('');
      };

      const revokeAdmin = (name) => {
        if (isPermanentAdmin(name)) return setAdminMsg(`Can't revoke a permanent admin!`);
        const stored = (() => { try { const r=localStorage.getItem(ADMINS_KEY); return r?JSON.parse(r):[]; } catch(e){return[];} })();
        saveAdmins(stored.filter(a => a !== name));
        setAdminMsg(`❌ ${name} removed from admins.`);
      };

      const giveCoinsToSelf = (amount) => {
        setPlayerData(prev => { const n = { ...prev, coins: prev.coins + amount }; saveGame(n); return n; });
        setSpawnMsg(`+${amount} coins added!`);
      };

      const giveSkinToSelf = (skinId) => {
        if (playerData.skins.includes(skinId)) return setSpawnMsg('You already own that skin.');
        setPlayerData(prev => { const n = { ...prev, skins: [...prev.skins, skinId] }; saveGame(n); return n; });
        setSpawnMsg(`🎨 ${SKINS.find(s=>s.id===skinId)?.name} skin unlocked!`);
      };

      const tabStyle = (t) => ({
        padding:'10px 18px', fontSize:'0.9rem', fontWeight:700, fontFamily:'inherit',
        background: tab===t ? 'linear-gradient(135deg,#7c3aed,#6d28d9)' : 'rgba(255,255,255,0.08)',
        border:'none', borderRadius:'12px', color:'#fff', cursor:'pointer'
      });

      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.85)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <div style={{ background:'linear-gradient(135deg,#1e1b4b,#312e81)', border:'3px solid #7c3aed', borderRadius:'25px', padding:'30px', maxWidth:'600px', width:'95%', maxHeight:'85vh', overflowY:'auto' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px' }}>
              <h2 style={{ color:'#fff', fontSize:'1.5rem', margin:0 }}>
                👑 Admin Panel <span style={{ color:'#fbbf24', fontSize:'0.9rem' }}>({playerData.username})</span>
              </h2>
              <button onClick={onClose} style={{ background:'rgba(239,68,68,0.3)', border:'2px solid #ef4444', borderRadius:'12px', color:'#fff', padding:'8px 16px', cursor:'pointer', fontFamily:'inherit', fontWeight:700 }}>✕ Close</button>
            </div>

            <div style={{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'20px' }}>
              {['tools','skins','admins','accounts','info'].map(t => (
                <button key={t} style={tabStyle(t)} onClick={() => { setTab(t); setDeleteMsg(''); setDeleteConfirm(null); }}>
                  {t==='tools'?'🛠️ Tools':t==='skins'?'🎨 Give Skins':t==='admins'?'👥 Admins':t==='accounts'?'🗑️ Accounts':'ℹ️ Info'}
                </button>
              ))}

            {tab === 'tools' && (

    // ============== MAIN COMPONENT ==============
    function PixelZone() {
      const [screen, setScreen] = useState('auth');
      const [playerData, setPlayerData] = useState(null);
      const [gameSettings, setGameSettings] = useState({ mode:'solo', matchLength:5, playerCount:20, roomCode:'' });
      const [gameResult, setGameResult] = useState(null);
      const [showAdmin, setShowAdmin] = useState(false);
      const [testMode, setTestMode] = useState(false);
      const [aimbotMode, setAimbotMode] = useState(false);
      const konamiRef = useRef([]);
      const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];

      // Load saved session on mount — fetch from Supabase
      useEffect(() => {
        const auth = loadAuth();
        if (auth && auth.username && !auth.username.startsWith('Guest')) {
          supa.from('accounts').select('*').eq('username', auth.username).single().then(({ data }) => {
            if (data) {
              setPlayerData(rowToPlayerData(data));
              setScreen('menu');
            } else {
              // Account deleted or not found — clear local auth
              try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
            }
          });
        }
      }, []);

      // Admin shortcut + Konami code
      useEffect(() => {
        const handleKey = (e) => {
          // Ctrl+Shift+A = admin panel
          if (e.ctrlKey && e.shiftKey && e.key === 'A' && playerData && isAdmin(playerData.username)) {
            setShowAdmin(v => !v);
          }
          // Konami code
          const key = e.key.toLowerCase();
          konamiRef.current = [...konamiRef.current, key].slice(-10);
          if (konamiRef.current.join(',') === KONAMI.join(',')) {
            setScreen('devroom');
            konamiRef.current = [];
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [playerData]);

      const handleLogin = (pd) => {
        setPlayerData(pd);
        if (!pd.username.startsWith('Guest')) saveGame(pd);
        setScreen('menu');
      };

      const handleLogout = () => {
        try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
        setPlayerData(null);
        setScreen('auth');
      };

      const startGame = () => setScreen('game');

      const endGame = (result) => {
        // Handle both local and server result formats
        const coinsEarned = result.coinsEarned || (result.kills * 50 + (result.placement === 1 ? 250 : 0));
        const xpEarned    = result.xpEarned    || (result.kills * 25 + (result.placement === 1 ? 120 : 15));
        const finalResult = { ...result, coinsEarned, xpEarned };
        setGameResult(finalResult);
        setPlayerData(prev => {
          const updated = {
            ...prev,
            coins: prev.coins + coinsEarned,
            xp: prev.xp + xpEarned,
            level: Math.floor((prev.xp + xpEarned) / 100) + 1,
            stats: {
              ...prev.stats,
              gamesPlayed: prev.stats.gamesPlayed + 1,
              kills: prev.stats.kills + (result.kills||0),
              wins: prev.stats.wins + (result.placement === 1 ? 1 : 0)
            }
          };
          if (!testMode && !prev.username.startsWith('Guest')) saveGame(updated);
          return updated;
        });
        setScreen('results');
      };

      const buyItem = (type, item) => {
        if (playerData.coins >= item.price && !playerData[type+'s'].includes(item.id)) {
          setPlayerData(prev => {
            const updated = { ...prev, coins: prev.coins - item.price, [type+'s']: [...prev[type+'s'], item.id] };
            if (!testMode && !prev.username.startsWith('Guest')) saveGame(updated);
            return updated;
          });
        }
      };

      const selectItem = (type, id) => {
        setPlayerData(prev => {
          const updated = { ...prev, ['selected'+type.charAt(0).toUpperCase()+type.slice(1)]: id };
          if (!testMode && !prev.username.startsWith('Guest')) saveGame(updated);
          return updated;
        });
      };

      if (!playerData && screen === 'auth') return <AuthScreen onLogin={handleLogin} />;

      return (
        <div style={styles.app}>
          {/* Test Mode banner */}
          {testMode && (
            <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:99998, textAlign:'center', padding:'6px', fontWeight:800, fontSize:'0.9rem', color:'#fff', animation:'testBanner 1s infinite', letterSpacing:'2px' }}>
              🧪 TEST MODE ACTIVE — NO DATA WILL BE SAVED 🧪
            </div>
          )}

          {/* Admin gear button */}
          {playerData && isAdmin(playerData.username) && (
            <button onClick={() => setShowAdmin(v=>!v)} title="Admin Panel (Ctrl+Shift+A)" style={{
              position:'fixed', bottom:'20px', right:'20px', zIndex:9997,
              background:'rgba(124,58,237,0.9)', border:'2px solid #a78bfa',
              borderRadius:'50%', width:'48px', height:'48px', fontSize:'1.2rem',
              cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
              boxShadow:'0 0 20px rgba(124,58,237,0.6)'
            }}>⚙️</button>
          )}

          {showAdmin && playerData && (
            <AdminPanel
              playerData={playerData} setPlayerData={setPlayerData}
              onClose={() => setShowAdmin(false)}
              testMode={testMode} setTestMode={setTestMode}
              aimbotMode={aimbotMode} setAimbotMode={setAimbotMode}
            />
          )}

          {screen === 'auth'     && <AuthScreen onLogin={handleLogin} />}
          {screen === 'menu'     && <MainMenu playerData={playerData} onPlay={() => setScreen('lobby')} onShop={() => setScreen('shop')} onSettings={() => setScreen('settings')} onFriends={() => setScreen('friends')} onLogout={handleLogout} />}
          {screen === 'lobby'    && <Lobby settings={gameSettings} setSettings={setGameSettings} onStart={startGame} onBack={() => setScreen('menu')} />}
          {screen === 'shop'     && <Shop playerData={playerData} onBuy={buyItem} onSelect={selectItem} onBack={() => setScreen('menu')} />}
          {screen === 'settings' && <Settings playerData={playerData} setPlayerData={setPlayerData} onBack={() => setScreen('menu')} testMode={testMode} />}
          {screen === 'friends'  && <Friends playerData={playerData} onBack={() => setScreen('menu')} />}
          {screen === 'game'     && <MultiplayerGame playerData={playerData} settings={gameSettings} onEnd={endGame} aimbotMode={aimbotMode} testMode={testMode} />}
          {screen === 'results'  && <Results result={gameResult} onPlayAgain={startGame} onMenu={() => setScreen('menu')} testMode={testMode} />}
          {screen === 'devroom'  && <DevRoom onBack={() => setScreen('menu')} />}
        </div>
      );
    }

    // ============== MAIN MENU ==============
    function MainMenu({ playerData, onPlay, onShop, onSettings, onFriends, onLogout }) {
      const [hoveredButton, setHoveredButton] = useState(null);
      const [pendingCount, setPendingCount]   = useState(0);
      const isGuest = playerData.username.startsWith('Guest');

      useEffect(() => {
        if (isGuest) return;
        // Count pending friend requests
        supa.from('friends')
          .select('id', { count:'exact' })
          .eq('receiver', playerData.username)
          .eq('status', 'pending')
          .then(({ count }) => setPendingCount(count || 0));

        // Update online status
        supa.from('accounts').update({ online: true, last_seen: new Date().toISOString() }).eq('username', playerData.username);

        // Mark offline on unload
        const markOffline = () => supa.from('accounts').update({ online: false }).eq('username', playerData.username);
        window.addEventListener('beforeunload', markOffline);
        return () => { window.removeEventListener('beforeunload', markOffline); markOffline(); };
      }, []);

      return (
        <div style={styles.menuContainer}>
          <FloatingShapes />
          <div style={styles.menuContent}>
            <div style={styles.logoSection}>
              <div style={styles.logoIcon}>🎮⚡</div>
              <h1 style={styles.logoTitle}>
                <span style={styles.logoPixel}>Pixel</span>
                <span style={styles.logoZone}>Zone</span>
              </h1>
              <div style={styles.logoRoyale}>BATTLE</div>
              <p style={styles.tagline}>Drop in. Build. Fight. Win!</p>
            </div>

            <div style={styles.playerCard}>
              <div style={{ ...styles.playerAvatar, background:`linear-gradient(135deg, ${SKINS.find(s=>s.id===playerData.selectedSkin)?.color}, ${SKINS.find(s=>s.id===playerData.selectedSkin)?.color}dd)` }}>
                <span style={styles.avatarEmoji}>{SKINS.find(s=>s.id===playerData.selectedSkin)?.emoji || '😎'}</span>
              </div>
              <div style={styles.playerDetails}>
                <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                  <div style={styles.playerName}>{playerData.username}</div>
                  {isOwner(playerData.username) && <span title="Owner" style={{ fontSize:'1.1rem' }}>👑</span>}
                  {!isOwner(playerData.username) && isAdmin(playerData.username) && <span title="Admin" style={{ fontSize:'1rem' }}>🛡️</span>}
                </div>
                <div style={styles.playerLevelBar}>
                  <div style={styles.levelBadge}>LVL {playerData.level}</div>
                  <div style={styles.xpBar}><div style={{...styles.xpFill, width:`${playerData.xp % 100}%`}} /></div>
                </div>
              </div>
              <div style={styles.coinDisplay}>
                <span style={styles.coinIcon}>🪙</span>
                <span style={styles.coinAmount}>{playerData.coins.toLocaleString()}</span>
              </div>
            </div>

            <div style={styles.buttonGroup}>
              <button style={{ ...styles.playButton, transform: hoveredButton==='play' ? 'scale(1.05) translateY(-4px)' : 'scale(1)', boxShadow: hoveredButton==='play' ? '0 20px 40px rgba(139,92,246,0.5)' : '0 10px 30px rgba(139,92,246,0.4)' }}
                onMouseEnter={()=>setHoveredButton('play')} onMouseLeave={()=>setHoveredButton(null)} onClick={onPlay}>
                <span style={styles.playButtonIcon}>▶</span>
                <span style={styles.playButtonText}>PLAY</span>
              </button>
              <div style={styles.secondaryButtons}>
                <button style={{ ...styles.secondaryButton, ...styles.shopButton, transform: hoveredButton==='shop' ? 'scale(1.05) translateY(-3px)' : 'scale(1)' }}
                  onMouseEnter={()=>setHoveredButton('shop')} onMouseLeave={()=>setHoveredButton(null)} onClick={onShop}>
                  <span style={styles.btnIcon}>🛍️</span><span>Shop</span>
                </button>
                <button style={{ ...styles.secondaryButton, ...styles.settingsButton, transform: hoveredButton==='settings' ? 'scale(1.05) translateY(-3px)' : 'scale(1)' }}
                  onMouseEnter={()=>setHoveredButton('settings')} onMouseLeave={()=>setHoveredButton(null)} onClick={onSettings}>
                  <span style={styles.btnIcon}>⚙️</span><span>Settings</span>
                </button>
                {!isGuest && (
                  <button style={{ ...styles.secondaryButton, background:'linear-gradient(135deg,#10b981,#059669)', boxShadow:'0 8px 25px rgba(16,185,129,0.4)', transform: hoveredButton==='friends' ? 'scale(1.05) translateY(-3px)' : 'scale(1)', position:'relative' }}
                    onMouseEnter={()=>setHoveredButton('friends')} onMouseLeave={()=>setHoveredButton(null)} onClick={onFriends}>
                    <span style={styles.btnIcon}>👥</span><span>Friends</span>
                    {pendingCount > 0 && (
                      <div style={{ position:'absolute', top:'-6px', right:'-6px', background:'#ef4444', color:'#fff', borderRadius:'50%', width:'20px', height:'20px', fontSize:'0.7rem', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        {pendingCount}
                      </div>
                    )}
                  </button>
                )}
              </div>
            </div>

            <div style={styles.statsRow}>
              <div style={styles.statBox}><span style={styles.statEmoji}>🏆</span><span style={styles.statNumber}>{playerData.stats.wins}</span><span style={styles.statLabel}>Wins</span></div>
              <div style={styles.statBox}><span style={styles.statEmoji}>💀</span><span style={styles.statNumber}>{playerData.stats.kills}</span><span style={styles.statLabel}>Eliminations</span></div>
              <div style={styles.statBox}><span style={styles.statEmoji}>🎮</span><span style={styles.statNumber}>{playerData.stats.gamesPlayed}</span><span style={styles.statLabel}>Games</span></div>
            </div>

            <button onClick={onLogout} style={{ background:'rgba(239,68,68,0.15)', border:'2px solid rgba(239,68,68,0.3)', borderRadius:'20px', color:'rgba(255,255,255,0.5)', padding:'10px 24px', cursor:'pointer', fontFamily:'inherit', fontSize:'0.85rem' }}>
              {isGuest ? '🔑 Login / Sign Up' : '🚪 Log Out'}
            </button>
          </div>
        </div>
      );
    }

    // ============== FRIENDS ==============
    function Friends({ playerData, onBack }) {
      const [tab, setTab]           = useState('friends'); // friends | requests | search
      const [friends, setFriends]   = useState([]);
      const [requests, setRequests] = useState([]);
      const [search, setSearch]     = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [msg, setMsg]           = useState('');
      const [loading, setLoading]   = useState(true);
      const me = playerData.username;

      const flash = (text, color='#34d399') => {
        setMsg({ text, color });
        setTimeout(() => setMsg(''), 3000);
      };

      const loadFriends = async () => {
        setLoading(true);
        // Get all accepted friendships where I'm either side
        const { data: rows } = await supa.from('friends').select('*').or(`sender.eq.${me},receiver.eq.${me}`).eq('status','accepted');
        // Get pending requests sent TO me
        const { data: reqs } = await supa.from('friends').select('*').eq('receiver', me).eq('status','pending');

        const friendNames = (rows||[]).map(r => r.sender === me ? r.receiver : r.sender);
        // Fetch their online status + level
        if (friendNames.length > 0) {
          const { data: profiles } = await supa.from('accounts').select('username,level,online,last_seen,selected_skin,stats').in('username', friendNames);
          setFriends((profiles||[]).map(p => ({
            ...p,
            rowId: (rows||[]).find(r => r.sender===p.username||r.receiver===p.username)?.id,
          })));
        } else {
          setFriends([]);
        }
        setRequests(reqs || []);
        setLoading(false);
      };

      useEffect(() => { loadFriends(); }, [tab]);

      const sendRequest = async (toUser) => {
        if (toUser === me) return flash("That's you!", '#f87171');
        // Check already friends or pending
        const { data: existing } = await supa.from('friends').select('*')
          .or(`and(sender.eq.${me},receiver.eq.${toUser}),and(sender.eq.${toUser},receiver.eq.${me})`);
        if (existing && existing.length > 0) {
          const s = existing[0].status;
          return flash(s==='accepted' ? 'Already friends!' : 'Request already sent!', '#f87171');
        }
        await supa.from('friends').insert({ sender: me, receiver: toUser, status:'pending' });
        flash(`Friend request sent to ${toUser}! 👋`);
        setSearchResults(prev => prev.map(r => r.username === toUser ? { ...r, requested:true } : r));
      };

      const acceptRequest = async (row) => {
        await supa.from('friends').update({ status:'accepted' }).eq('id', row.id);
        flash(`You and ${row.sender} are now friends! 🎉`);
        loadFriends();
      };

      const declineRequest = async (row) => {
        await supa.from('friends').delete().eq('id', row.id);
        flash(`Request from ${row.sender} declined.`, '#a5b4fc');
        loadFriends();
      };

      const removeFriend = async (rowId, username) => {
        await supa.from('friends').delete().eq('id', rowId);
        flash(`Removed ${username} from friends.`, '#a5b4fc');
        loadFriends();
      };

      const doSearch = async () => {
        if (!search.trim() || search.trim().length < 2) return;
        const { data } = await supa.from('accounts').select('username,level,online,selected_skin,stats')
          .ilike('username', `%${search.trim()}%`).neq('username', me).limit(10);
        // Mark already-requested
        const { data: myReqs } = await supa.from('friends').select('*').or(`and(sender.eq.${me},receiver.eq.${data?.map(d=>d.username).join(',')})`);
        setSearchResults((data||[]).map(r => ({
          ...r,
          requested: (myReqs||[]).some(req => req.receiver===r.username||req.sender===r.username)
        })));
      };

      const skinEmoji = (skin) => ({ default:'😎',bubblegum:'🍬',mint:'🌿',ocean:'🌊',sunset:'🌅',golden:'⭐',galaxy:'🌌',cherry:'🍒',pug_taco:'🌮' }[skin]||'😎');
      const skinColor = (skin) => ({ default:'#8b5cf6',bubblegum:'#ec4899',mint:'#10b981',ocean:'#0ea5e9',sunset:'#f97316',golden:'#eab308',galaxy:'#6366f1',cherry:'#ef4444',pug_taco:'#d97706' }[skin]||'#8b5cf6');

      const tabBtn = (t, label) => (
        <button key={t} onClick={() => setTab(t)} style={{
          flex:1, padding:'12px', fontSize:'0.9rem', fontWeight:700, fontFamily:'inherit',
          background: tab===t ? 'linear-gradient(135deg,#10b981,#059669)' : 'rgba(255,255,255,0.06)',
          border:'none', borderRadius:'12px', color:'#fff', cursor:'pointer', position:'relative',
        }}>
          {label}
          {t==='requests' && requests.length>0 && (
            <span style={{ position:'absolute', top:'-6px', right:'-6px', background:'#ef4444', borderRadius:'50%', width:'18px', height:'18px', fontSize:'0.65rem', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center' }}>
              {requests.length}
            </span>
          )}
        </button>
      );

      const FriendCard = ({ f, showRemove }) => (
        <div style={{ display:'flex', alignItems:'center', gap:'12px', background:'rgba(255,255,255,0.05)', borderRadius:'15px', padding:'12px 16px', border: f.online ? '1px solid rgba(16,185,129,0.3)' : '1px solid transparent' }}>
          <div style={{ width:'42px', height:'42px', borderRadius:'50%', background:`linear-gradient(135deg,${skinColor(f.selected_skin)},${skinColor(f.selected_skin)}aa)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'1.3rem', border: f.online ? '2px solid #10b981' : '2px solid rgba(255,255,255,0.1)', flexShrink:0 }}>
            {skinEmoji(f.selected_skin)}
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ color:'#fff', fontWeight:700, fontSize:'0.95rem' }}>{f.username}</div>
            <div style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'2px' }}>
              <span style={{ color: f.online ? '#10b981' : '#6b7280', fontSize:'0.75rem', fontWeight:600 }}>
                {f.online ? '● Online' : '○ Offline'}
              </span>
              <span style={{ color:'#a5b4fc', fontSize:'0.75rem' }}>Lv{f.level}</span>
              <span style={{ color:'#a5b4fc', fontSize:'0.75rem' }}>🏆{f.stats?.wins||0} 💀{f.stats?.kills||0}</span>
            </div>
          </div>
          {showRemove && (
            <button onClick={() => removeFriend(f.rowId, f.username)} style={{ background:'rgba(239,68,68,0.15)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'10px', color:'#f87171', padding:'6px 12px', cursor:'pointer', fontFamily:'inherit', fontSize:'0.8rem' }}>
              Remove
            </button>
          )}
        </div>
      );

      return (
        <div style={{ minHeight:'100vh', background:'linear-gradient(135deg,#1e1b4b,#0f2027)', position:'relative', padding:'20px' }}>
          <FloatingShapes colors={['#10b981','#34d399','#6ee7b7']} />
          <button style={styles.backBtn} onClick={onBack}>← Back</button>

          <div style={{ maxWidth:'600px', margin:'20px auto', position:'relative', zIndex:1 }}>
            <h1 style={{ color:'#fff', fontSize:'2rem', fontWeight:900, textAlign:'center', marginBottom:'6px' }}>👥 Friends</h1>
            <p style={{ color:'#a5b4fc', textAlign:'center', fontSize:'0.9rem', marginBottom:'25px' }}>Connect with other Pixel Zone players</p>

            {msg && (
              <div style={{ background:'rgba(0,0,0,0.4)', border:`1px solid ${msg.color}`, borderRadius:'12px', padding:'10px 16px', marginBottom:'16px', color: msg.color, textAlign:'center', fontSize:'0.9rem' }}>
                {msg.text}
              </div>
            )}

            {/* Tabs */}
            <div style={{ display:'flex', gap:'8px', marginBottom:'20px' }}>
              {tabBtn('friends', `👥 Friends (${friends.length})`)}
              {tabBtn('requests', `📬 Requests`)}
              {tabBtn('search', '🔍 Find Players')}
            </div>

            {loading && <div style={{ color:'#a5b4fc', textAlign:'center', padding:'30px' }}>Loading...</div>}

            {/* Friends list */}
            {!loading && tab === 'friends' && (
              <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                {friends.length === 0 ? (
                  <div style={{ color:'#a5b4fc', textAlign:'center', padding:'40px 20px' }}>
                    <div style={{ fontSize:'3rem', marginBottom:'12px' }}>👥</div>
                    <div style={{ fontSize:'1rem', marginBottom:'6px' }}>No friends yet</div>
                    <div style={{ fontSize:'0.85rem', opacity:0.6 }}>Search for players to add them!</div>
                  </div>
                ) : (
                  <>
                    {friends.filter(f=>f.online).length > 0 && (
                      <>
                        <div style={{ color:'#10b981', fontSize:'0.8rem', fontWeight:700, marginBottom:'4px' }}>ONLINE</div>
                        {friends.filter(f=>f.online).map(f => <FriendCard key={f.username} f={f} showRemove={true} />)}
                        <div style={{ color:'#6b7280', fontSize:'0.8rem', fontWeight:700, marginTop:'8px', marginBottom:'4px' }}>OFFLINE</div>
                      </>
                    )}
                    {friends.filter(f=>!f.online).map(f => <FriendCard key={f.username} f={f} showRemove={true} />)}
                  </>
                )}
              </div>
            )}

            {/* Pending requests */}
            {!loading && tab === 'requests' && (
              <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                {requests.length === 0 ? (
                  <div style={{ color:'#a5b4fc', textAlign:'center', padding:'40px 20px' }}>
                    <div style={{ fontSize:'3rem', marginBottom:'12px' }}>📬</div>
                    <div>No pending friend requests</div>
                  </div>
                ) : requests.map(req => (
                  <div key={req.id} style={{ display:'flex', alignItems:'center', gap:'12px', background:'rgba(255,255,255,0.05)', borderRadius:'15px', padding:'14px 16px', border:'1px solid rgba(139,92,246,0.3)' }}>
                    <div style={{ fontSize:'2rem' }}>👋</div>
                    <div style={{ flex:1 }}>
                      <div style={{ color:'#fff', fontWeight:700 }}>{req.sender}</div>
                      <div style={{ color:'#a5b4fc', fontSize:'0.8rem' }}>wants to be your friend</div>
                    </div>
                    <div style={{ display:'flex', gap:'8px' }}>
                      <button onClick={() => acceptRequest(req)} style={{ background:'linear-gradient(135deg,#10b981,#059669)', border:'none', borderRadius:'10px', color:'#fff', padding:'8px 16px', cursor:'pointer', fontFamily:'inherit', fontWeight:700, fontSize:'0.85rem' }}>
                        ✓ Accept
                      </button>
                      <button onClick={() => declineRequest(req)} style={{ background:'rgba(239,68,68,0.15)', border:'1px solid rgba(239,68,68,0.4)', borderRadius:'10px', color:'#f87171', padding:'8px 12px', cursor:'pointer', fontFamily:'inherit', fontSize:'0.85rem' }}>
                        ✕
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Search */}
            {tab === 'search' && (
              <div>
                <div style={{ display:'flex', gap:'10px', marginBottom:'16px' }}>
                  <input value={search} onChange={e => setSearch(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && doSearch()}
                    placeholder="Search by username..."
                    style={{ flex:1, padding:'13px 16px', fontSize:'1rem', fontFamily:'inherit', background:'rgba(255,255,255,0.1)', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'12px', color:'#fff', outline:'none' }}
                  />
                  <button onClick={doSearch} style={{ padding:'13px 22px', background:'linear-gradient(135deg,#8b5cf6,#7c3aed)', border:'none', borderRadius:'12px', color:'#fff', cursor:'pointer', fontFamily:'inherit', fontWeight:700, fontSize:'1rem' }}>
                    Search
                  </button>
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                  {searchResults.map(r => (
                    <div key={r.username} style={{ display:'flex', alignItems:'center', gap:'12px', background:'rgba(255,255,255,0.05)', borderRadius:'15px', padding:'12px 16px' }}>
                      <div style={{ width:'40px', height:'40px', borderRadius:'50%', background:`linear-gradient(135deg,${skinColor(r.selected_skin)},${skinColor(r.selected_skin)}aa)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'1.2rem' }}>
                        {skinEmoji(r.selected_skin)}
                      </div>
                      <div style={{ flex:1 }}>
                        <div style={{ color:'#fff', fontWeight:700 }}>{r.username}</div>
                        <div style={{ color:'#a5b4fc', fontSize:'0.75rem' }}>
                          Lv{r.level} · {r.online ? '🟢 Online' : '⚫ Offline'} · 🏆{r.stats?.wins||0}
                        </div>
                      </div>
                      <button onClick={() => sendRequest(r.username)} disabled={r.requested} style={{
                        background: r.requested ? 'rgba(255,255,255,0.08)' : 'linear-gradient(135deg,#10b981,#059669)',
                        border:'none', borderRadius:'10px', color: r.requested ? '#6b7280' : '#fff',
                        padding:'8px 16px', cursor: r.requested ? 'not-allowed' : 'pointer',
                        fontFamily:'inherit', fontWeight:700, fontSize:'0.85rem'
                      }}>
                        {r.requested ? '✓ Sent' : '+ Add'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== LOBBY ==============
    function Lobby({ settings, setSettings, onStart, onBack }) {
      const [searching, setSearching] = useState(false);
      const [playersFound, setPlayersFound] = useState(1);
      const [selectedMode, setSelectedMode] = useState(settings.mode);

      useEffect(() => {
        if (searching) {
          const interval = setInterval(() => {
            setPlayersFound(prev => {
              if (prev >= settings.playerCount) { clearInterval(interval); setTimeout(onStart, 500); return prev; }
              return Math.min(prev + Math.floor(Math.random()*4)+1, settings.playerCount);
            });
          }, 200);
          return () => clearInterval(interval);
        }
      }, [searching, settings.playerCount, onStart]);

      const [privateCode, setPrivateCode] = useState(settings.roomCode || '');
      return (
        <div style={styles.lobbyContainer}>
          <FloatingShapes colors={['#8b5cf6','#a78bfa','#c4b5fd']} />
          <button style={styles.backBtn} onClick={onBack}>← Back</button>
          <div style={styles.lobbyContent}>
            <h1 style={styles.lobbyTitle}><span style={styles.lobbyIcon}>🎯</span>Choose Your Mode</h1>
            <div style={{ background:'rgba(255,255,255,0.06)', borderRadius:'20px', padding:'20px 25px', marginBottom:'20px' }}>
              <div style={{ color:'#a5b4fc', fontSize:'0.85rem', marginBottom:'10px' }}>🔑 Private Room (optional)</div>
              <div style={{ display:'flex', gap:'10px' }}>
                <input value={privateCode} onChange={e=>{ setPrivateCode(e.target.value.toUpperCase()); setSettings(s=>({...s,roomCode:e.target.value.toUpperCase()})); }} placeholder="Enter room code or leave blank for public..." maxLength={8}
                  style={{ flex:1, padding:'12px 16px', fontSize:'1rem', fontFamily:'inherit', background:'rgba(255,255,255,0.1)', border:'2px solid rgba(255,255,255,0.2)', borderRadius:'15px', color:'#fff', outline:'none', letterSpacing:'3px', textTransform:'uppercase' }} />
                <button onClick={()=>{ setPrivateCode(''); setSettings(s=>({...s,roomCode:''})); }} style={{ padding:'12px 18px', background:'rgba(239,68,68,0.2)', border:'2px solid rgba(239,68,68,0.3)', borderRadius:'15px', color:'#f87171', cursor:'pointer', fontFamily:'inherit' }}>✕</button>
              </div>
              <div style={{ color:'rgba(255,255,255,0.3)', fontSize:'0.78rem', marginTop:'8px' }}>{privateCode ? `Joining private room: ${privateCode}` : 'No code = join public matchmaking'}</div>
            </div>
            {!searching ? (

    function randSpawn() {

      return { x: MAP_SZ/2 + Math.cos(angle)*dist, y: MAP_SZ/2 + Math.sin(angle)*dist };
    }

    function genLoot() {
      const types = ['weapon','ammo','materials','health'];
      const weps  = Object.keys(WEP).filter(w => w !== 'pistol');
      return Array.from({ length: 40 }, (_, i) => {
        const type = types[Math.floor(Math.random()*types.length)];
        return {
          id: 'loot_'+i,
          x:  150 + Math.random()*(MAP_SZ-300),
          y:  150 + Math.random()*(MAP_SZ-300),
          type, weapon: type==='weapon' ? weps[Math.floor(Math.random()*weps.length)] : null,
          value: type==='ammo'?20:type==='materials'?30:type==='health'?25:0,
        };
      });
    }

    function genStations() {
      return Array.from({ length:6 }, (_,i) => {
        const a = (i/6)*Math.PI*2;
        return { id:'st_'+i, x:MAP_SZ/2+Math.cos(a)*MAP_SZ*0.25, y:MAP_SZ/2+Math.sin(a)*MAP_SZ*0.25, radius:55, used:false };
      });
    }

      const w = wepList[Math.floor(Math.random()*wepList.length)];

        dead:false, kills:0, lastShot:0, moveTimer:0, _vx:0, _vy:0,
        aimAngle:0,
